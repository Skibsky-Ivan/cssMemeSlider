<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cssMenuSlider</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section class="content">
      <h1 class="title">css meme slider</h1>

      <div class="slider">
        <input
          class="slider-radio slider-1-radio"
          type="radio"
          name="slide"
          id="slide-1"
          checked />

        <input
          class="slider-radio slider-2-radio"
          type="radio"
          name="slide"
          id="slide-2" />

        <input
          class="slider-radio slider-3-radio"
          type="radio"
          name="slide"
          id="slide-3" />

        <input
          class="slider-radio slider-4-radio"
          type="radio"
          name="slide"
          id="slide-4" />

        <div class="slider-viewport">
          <div class="slider-track">
            <div class="slide">
              <img
                src="./img/slider-1.webp"
                alt=""
                class="slide-img" />
            </div>
            <div class="slide">
              <img
                src="./img/slide-2.webp"
                alt=""
                class="slide-img" />
            </div>
            <div class="slide">
              <img
                src="./img/slide-3.jpg"
                alt=""
                class="slide-img" />
            </div>
            <div class="slide">
              <img
                src="./img/slide-4.png"
                alt=""
                class="slide-img" />
            </div>
          </div>
        </div>

        <div class="slider-footer">
          <div class="caption-viewport">
            <div class="caption-track">
              <p class="caption">slide-1</p>
              <p class="caption">slide-2</p>
              <p class="caption">slide-3</p>
              <p class="caption">slide-4</p>
            </div>
          </div>

          <div class="slider-control">
            <label class="slider-label" for="slide-1">
              <div class="slider-mark"></div>
            </label>
            <label class="slider-label" for="slide-2">
              <div class="slider-mark"></div>
            </label>
            <label class="slider-label" for="slide-3">
              <div class="slider-mark"></div>
            </label>
            <label class="slider-label" for="slide-4">
              <div class="slider-mark"></div>
            </label>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
